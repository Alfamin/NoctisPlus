name: Noctis Plus Windows preview

on:
  push:
    branches: [main]
    # Version tags reuse the identical green main package, or build/check it before publishing.
    tags: ['v*']
    paths-ignore: ['website/**']
  pull_request:
    branches: [main]
    paths-ignore: ['website/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A version tag on a commit that main already built, tested and install-checked publishes that run's files
  # instead of doing it all again (owner, 2026-10-19: a release took 20 minutes). No such run, or its files
  # expired: the full Windows job below runs as before.
  reuse:
    if: github.repository != 'heartached/Noctis' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find the green main run of this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/noctis-plus.yml/runs?branch=main&event=push&status=success&head_sha=$GITHUB_SHA" --jq '.workflow_runs[0].id // empty')
          if [ -n "$run" ] && gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
               --jq '.artifacts[] | select(.name == "NoctisPlus-windows-x64" and .expired == false) | .id' | grep -q .; then
            echo "Reusing main run $run for $GITHUB_SHA"
            echo "run_id=$run" >> "$GITHUB_OUTPUT"
          else
            echo "No green main run with files for $GITHUB_SHA; building and testing this tag."
          fi

  # The suite on four runners at once (owner, 2026-10-19: get releases out sooner, same results). Test classes are
  # listed, sorted and dealt round-robin, so every class runs exactly once; each shard is the old single run's
  # command limited to its classes.
  tests:
    needs: reuse
    if: ${{ !cancelled() && github.repository != 'heartached/Noctis' && needs.reuse.outputs.run_id == '' }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      # Shards restore only; the packaging job saves the shared package cache once.
      # This avoids five runners compressing/uploading the same cold cache together.
      - name: Restore NuGet package cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet10-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', 'global.json') }}
          restore-keys: ${{ runner.os }}-dotnet10-nuget-v1-
      - name: Restore existing dependencies
        run: dotnet restore tests/Noctis.Tests/Noctis.Tests.csproj
      - name: Build tests
        run: dotnet build tests/Noctis.Tests/Noctis.Tests.csproj -c Release --no-restore --nologo
      - name: Test this shard with bounded parallelism
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          New-Item -ItemType Directory -Path artifacts/plus -Force | Out-Null
          $dll = 'tests/Noctis.Tests/bin/Release/net10.0-windows10.0.19041.0/Noctis.Tests.dll'
          $classes = @(dotnet $dll -list classes | Where-Object { $_ -match '^Noctis\.' } | Sort-Object -Unique)
          if ($classes.Count -lt 50) { Write-Host "::error::Only $($classes.Count) test classes were listed."; exit 1 }
          $mine = @(for ($i = [int]$env:SHARD; $i -lt $classes.Count; $i += [int]$env:SHARDS) { $classes[$i] })
          Write-Host "Shard ${env:SHARD} of ${env:SHARDS}: $($mine.Count) of $($classes.Count) test classes"
          $filter = @(); foreach ($c in $mine) { $filter += @('-class', $c) }
          dotnet $dll -parallelAlgorithm conservative -maxThreads 4 -longRunning 60 -noColor -xml "artifacts/plus/ci-tests-$env:SHARD.xml" @filter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: List failed tests on the run page
        # Annotations are readable without signing in, unlike the log and the report artifact.
        if: failure()
        shell: pwsh
        run: |
          $report = "artifacts/plus/ci-tests-${{ matrix.shard }}.xml"
          if (!(Test-Path $report)) { Write-Host '::error::No test report was written.'; exit 0 }
          [xml]$x = Get-Content $report -Raw
          $clean = { param($s) $c = ([string]$s -replace '%', '%25' -replace '\r?\n', ' '); $c.Substring(0, [Math]::Min(400, $c.Length)) }
          foreach ($t in $x.SelectNodes("//test[@result='Fail']")) {
            Write-Host ("::error title=FAIL {0}::{1}" -f $t.name, (& $clean $t.failure.message.InnerText))
          }
          foreach ($e in $x.SelectNodes('//errors/error')) {
            Write-Host ("::error title=ERROR {0} {1}::{2}" -f $e.type, $e.name, (& $clean $e.failure.message.InnerText))
          }
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NoctisPlus-tests-${{ matrix.shard }}
          path: artifacts/plus/*.xml
          if-no-files-found: ignore

  # Package and install-check at the same time as the tests; a release needs both green.
  windows:
    needs: reuse
    if: ${{ !cancelled() && github.repository != 'heartached/Noctis' && needs.reuse.outputs.run_id == '' }}
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Restore and save NuGet package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet10-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', 'global.json') }}
          restore-keys: ${{ runner.os }}-dotnet10-nuget-v1-
      - name: Restore existing dependencies
        run: dotnet restore tests/Noctis.Tests/Noctis.Tests.csproj
      - name: Inno Setup (preinstalled, else from Chocolatey)
        shell: powershell
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) { choco install innosetup --no-progress -y; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Write-Host ('Inno Setup ' + (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion)
      - name: Package portable preview and installer
        shell: powershell
        env:
          # Owner #185: the built-in Telegram app for new users; empty (users bring their own) when not set.
          NOCTIS_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          NOCTIS_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: .\scripts\Build-NoctisPlus.ps1 -Installer
      - name: Install, first-start import, reinstall and uninstall on this runner
        shell: powershell
        run: |
          $setup = Get-ChildItem -Path release-artifacts -Filter 'NoctisPlus-v*-Setup.exe' | Select-Object -First 1
          .\scripts\ci\Test-NoctisPlusInstall.ps1 -Setup $setup.FullName
      - name: Upload portable preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NoctisPlus-windows-x64
          path: |
            release-artifacts/NoctisPlus-windows-x64.zip
            release-artifacts/NoctisPlus-v*-Setup.exe
            release-artifacts/SHA256SUMS
            scripts/install.ps1
          if-no-files-found: error
          retention-days: 14

  release:
    # Only for a version tag, and only after this commit was built, tested and install-checked: by main's run
    # (reused) or by the Windows job of this tag.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && ((needs.windows.result == 'success' && needs.tests.result == 'success') || (needs.windows.result == 'skipped' && needs.tests.result == 'skipped' && needs.reuse.outputs.run_id != '')) }}
    needs: [reuse, tests, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REUSED_RUN: ${{ needs.reuse.outputs.run_id }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh run download "${REUSED_RUN:-$GITHUB_RUN_ID}" --repo "$GITHUB_REPOSITORY" --name NoctisPlus-windows-x64 --dir dist
          setup="dist/release-artifacts/NoctisPlus-v${version}-Setup.exe"
          # The tag must match the version the app was built with, or the updater would offer it forever.
          test -f "$setup" || { echo "No $setup: bump <Version> in src/Noctis/Noctis.csproj to $version before tagging."; ls -R dist; exit 1; }
          notes="docs/fork/releases/${TAG}.md"
          test -f "$notes" || { echo "Missing release notes $notes"; exit 1; }
          (cd dist/release-artifacts && sha256sum -c SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Noctis Plus ${version}" --notes-file "$notes" \
            "$setup" dist/release-artifacts/SHA256SUMS dist/release-artifacts/NoctisPlus-windows-x64.zip
