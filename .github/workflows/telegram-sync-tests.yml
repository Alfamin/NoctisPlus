name: Telegram sync tests

# Runs the Telegram sync core tests on Linux. The phone app is Linux-based, so
# a green run here proves the sync core works off Windows.
on:
  push:
    branches: ['android-plus*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/Noctis.TelegramSync.Tests -c Release
