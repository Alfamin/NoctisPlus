name: Telegram sync tests

# Runs the Telegram sync core tests on Linux. The phone app is Linux-based, so
# a green run here proves the sync core works off Windows.
on:
  push:
    branches: ['android-plus*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/Noctis.TelegramSync.Tests -c Release
